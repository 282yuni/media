# 임플란트 혜택 이벤트 콜 상황표. 번호 = 녹음대본.txt 번호.
# interrupt: true → 질문의 대답을 기다리는 중에도 이 상황으로 대응 (거절·망설임 등)
# always: true  → 질문의 대답을 기다리는 중에도 끼어드는 상황 (수신거부, AI 질문 등)
# ask: 항목     → 이 멘트가 질문이면 고객 대답을 그대로 메모에 적고 다음 멘트로
# resume: true  → 그 대답을 하고 바로 스크립트 다음 멘트로 이어감
# 상황의 ask + after_answer → 그 상황에서 물은 질문의 대답을 적고, 정해 둔 말을 하고 (end 면) 끊음
# 질문 도중 상대가 되물으면("얼마예요?") 그 상황으로 답하고 원래 질문 녹음을 다시 틉니다

flow:   # 첫인사(1번) 다음 순서
  - say: "[클립:2] [클립:3] [클립:4] [클립:5]"
    ask: "내원 가능"
  - say: "[클립:6] [클립:7]"
  - say: "[클립:8]"
    ask: "부위"
    status: "상담중"
  - say: "[클립:9]"
    ask: "개수"
  - say: "[클립:10]"
    ask: "불편한 곳"
  - say: "[클립:11]"
    ask: "평일/주말"
  - say: "[클립:12]"
    ask: "오전/오후"
  - say: "[클립:13] [클립:14] [클립:15]"
    status: "상담완료"
    end: true

scenarios:
  - name: 수신거부
    always: true
    keywords: ["연락하지 마", "전화하지 마", "번호 지워", "그만 전화", "다시는", "귀찮게"]
    reply: ["[클립:30]"]
    status: "수신거부"
    end: true
  - name: AI 질문
    always: true
    keywords: ["AI", "에이아이", "기계", "로봇", "자동응답", "사람이에요", "사람 맞", "녹음이에요", "ARS"]
    reply: ["[클립:34]"]
    handoff: true
  - name: 담당자 요청
    always: true
    keywords: ["담당자", "바꿔", "직접 통화", "원장님 바꿔", "실장님"]
    reply: ["[클립:35]"]
    handoff: true
  - name: 바쁨
    always: true
    keywords: ["바빠", "바쁘", "나중에", "운전 중", "운전중", "회의", "시간 없"]
    reply: ["[클립:20] [클립:21]"]          # 다시 연락드려도 될까요? 오전/오후?
    status: "재통화"
    ask: "재통화 시간"                      # 대답을 메모에 적고
    after_answer: {say: "[클립:22]", status: "재통화", end: true}   # 그 시간에 연락드릴게요 → 끝
  - name: 본인 아님
    interrupt: true
    keywords: ["아닌데", "잘못 거", "잘못거", "그런 사람", "아니에요"]
    examples: ["아닌데요", "잘못 거셨어요"]
    reply: ["[클립:19]"]
    status: "번호확인"
    ask: "본인 통화 가능 시간"
    after_answer: {say: "[클립:22]", status: "재통화", end: true}
  - name: 신청 안 했음
    interrupt: true
    keywords: ["신청 안", "신청한 적", "한 적 없", "모르는데", "신청한 기억"]
    reply: ["[클립:26]"]
  - name: 어디서 전화
    keywords: ["누구세요", "어디세요", "어디서", "무슨 일", "어떤 일", "무슨 치과"]
    reply: ["[클립:31]"]
    resume: false
  - name: 가격 문의
    keywords: ["얼마", "가격", "비용", "금액", "비싸", "싸요", "할인"]
    reply: ["[클립:23] [클립:24]"]
    status: "관심"
  - name: 위치 문의
    keywords: ["위치", "어디에 있", "어디 있", "멀어", "먼데", "주차", "가까"]
    reply: ["[클립:25]"]
  - name: 다니는 치과 있음
    interrupt: true
    keywords: ["다니는 데", "다니는 치과", "다니고 있", "하는 데 있", "이미 했"]
    reply: ["[클립:36]"]
  - name: 무서움·통증 걱정
    interrupt: true
    keywords: ["무서", "아플까", "아프지 않", "겁나", "걱정"]
    reply: ["[클립:37]"]
  - name: 나이·뼈 걱정
    keywords: ["나이", "뼈", "당뇨", "혈압", "가능할까", "될까요"]
    reply: ["[클립:38]"]
  - name: 생각해볼게
    interrupt: true
    keywords: ["생각해 볼", "생각해볼", "고민", "상의", "가족이랑", "알아보고"]
    reply: ["[클립:27] [클립:21]"]
    status: "재통화"
    ask: "재통화 시간"
    after_answer: {say: "[클립:22]", status: "재통화", end: true}
  - name: 관심 없음
    interrupt: true
    keywords: ["관심 없", "필요 없", "안 해요", "됐어요", "생각 없", "안 할"]
    reply: ["[클립:28]", "[클립:29]"]   # 첫 번째는 한 번 더 권유, 두 번째는 인사하고 끊기
    status: "거절"
    end_on_repeat: true
  - name: 잘 안 들림
    keywords: ["안 들려", "뭐라고요", "다시 말씀", "잘 안 들"]
    reply: ["[클립:33]"]

default:
  reply: ["[클립:32]"]
  handoff: true
