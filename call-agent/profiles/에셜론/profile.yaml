# 에셜론 — 네이버 플레이스 상위노출 마케팅 1차 콜 (무료 모드: 내 녹음 그대로)
engine: "free"
agent:
  my_name: ""
  company: "에셜론"
  product: "네이버 플레이스 상위노출 마케팅 제안서 안내"
  opening: "[클립:1]"          # 업종별 첫인사는 scenarios.yaml 의 flows 가 우선
  ai_disclosure: ""
  fillers: []   # 맞장구 끔: 25번·26번 둘 다 임시 녹음("네, 알겠습니다" / "충분히 이해해요")이라 대답마다 붙으면 어색함. 진짜 "네~" 녹음이 생기면 다시 넣기
  hello_again: ["[클립:32]", "[클립:38]"]   # 1번째 "여보세요?" → 2번째 "여보세요? 제 말 잘 들리세요?"
  hello_again_times: 2           # 대답 없으면 여보세요? → 또 없으면 여보세요? → 그래도 없으면 끊기
voice:
  keyterms: ["네이버 플레이스", "상위노출", "블로그", "인스타그램", "제안서", "에셜론"]
rules:
  branch_column: "업종"
customers:
  path: "data/에셜론_고객.xlsx"
  columns: {name: "상호명", clinic: "상호명", phone: "전화번호", status: "상태", memo: "메모", last_call: "통화일시"}
notify:
  kakao_room: ""                    # ← 담당자 카톡 대화방 이름 (창 제목과 똑같이). 예: "김팀장"
  on_status: ["제안서발송"]          # 이 결과로 끝난 통화만 녹취록을 보냄
