# 연습 녹음(82문장) 번호에 맞춘 테스트 상황표. 번호 = python main.py --profile 연습녹음 clips 녹음.mp3 로 자른 순서.
flow:
  - say: "[클립:4] [클립:5]"                 # 연락드린 이유 / 지금 잠깐 시간 괜찮으세요?
    ask: "통화 가능"
  - say: "[클립:12] [클립:16] [클립:17]"     # 서비스 설명 / 필요한 서비스인지 확인 / 비슷한 안내 받아보신 적?
    ask: "이전 안내 경험"
  - say: "[클립:19] [클립:20]"               # 어떤 부분이 궁금? 가격? 이용방법?
    ask: "궁금한 점"
  - say: "[클립:22] [클립:26] [클립:27]"     # 비용뿐 아니라… / 바로 결정 안 하셔도 / 방문 설명 어떠세요?
    ask: "방문 상담 의향"
    status: "관심"
  - say: "[클립:30]"                         # 이번주 화요일? 목요일 오후?
    ask: "방문 희망일"
  - say: "[클립:33] [클립:38] [클립:47]"     # 정확히 확인할게요 / 일정 변경되면 말씀 / 다른 질문 있으세요?
    ask: "추가 질문"
    status: "방문예약"
  - say: "[클립:80] [클립:81] [클립:82]"     # 오늘 안내 여기까지 / 궁금한 점 문의 / 좋은 하루 보내세요
    end: true

scenarios:
  - name: 수신거부
    always: true
    keywords: ["연락하지 마", "전화하지 마", "번호 지워", "그만 전화", "다시는", "귀찮게"]
    reply: ["[클립:58]"]                      # 더 이상 원하지 않으시면 존중하겠습니다… 감사합니다
    status: "수신거부"
    end: true
  - name: AI 질문
    always: true
    keywords: ["AI", "에이아이", "기계", "로봇", "자동응답", "사람이에요", "사람 맞", "녹음이에요", "ARS"]
    reply: ["[클립:11]"]                      # 네, 알겠습니다. → 바로 나에게 넘김 (사람이라고 하지 않음)
    handoff: true
  - name: 담당자 요청
    always: true
    keywords: ["담당자", "바꿔", "직접 통화", "책임자"]
    reply: ["[클립:11]"]
    handoff: true
  - name: 바쁨
    always: true
    keywords: ["바빠", "바쁘", "나중에", "운전 중", "운전중", "회의", "시간 없", "지금 안 돼", "지금은 좀"]
    reply: ["[클립:6] [클립:7] [클립:8] [클립:9]"]   # 그러시군요 / 바쁘실 때… / 편하신 시간에 다시? / 오전? 오후?
    status: "재통화"
    ask: "재통화 시간"
    after_answer: {say: "[클립:11] [클립:57]", status: "재통화", end: true}   # 네 알겠습니다 / 말씀해주셔서 감사합니다
  - name: 이해 안 됨
    interrupt: true
    keywords: ["무슨 뜻", "무슨 말", "어렵", "모르겠", "이해가 안"]
    reply: ["[클립:60] [클립:61]", "[클립:63] [클립:65] [클립:66] [클립:67] [클립:68]"]
  - name: 비싸다
    interrupt: true
    keywords: ["비싸", "부담", "돈이 없", "여유가 없", "비용 때문"]
    reply: ["[클립:43] [클립:44] [클립:45] [클립:46]"]
  - name: 가격 문의
    keywords: ["얼마", "가격", "비용", "금액", "요금", "월에"]
    reply: ["[클립:21] [클립:25]"]           # 가격이 중요하죠 / 실제 비용은 계약조건에 따라… 담당자 통해 확인
    status: "관심"
  - name: 이미 이용 중
    interrupt: true
    keywords: ["이용하고 있", "쓰고 있", "다른 데", "하는 데 있", "가입돼"]
    reply: ["[클립:41] [클립:42]"]
  - name: 방문 부담
    interrupt: true
    keywords: ["방문은", "오시는 건", "집에 오", "만나는 건", "찾아오"]
    reply: ["[클립:28]"]
  - name: 누구세요
    keywords: ["누구세요", "어디세요", "어디서", "무슨 일", "왜 전화"]
    reply: ["[클립:4]"]
  - name: 생각해볼게
    interrupt: true
    keywords: ["생각해 볼", "생각해볼", "고민", "상의", "알아보고", "다음에"]
    reply: ["[클립:26] [클립:70] [클립:71]"]  # 바로 결정 안 하셔도 / 다음주에 다시? / 월요일 11시? 화요일 3시?
    status: "재통화"
    ask: "재통화 시간"
    after_answer: {say: "[클립:72]", status: "재통화", end: true}
  - name: 관심 없음
    interrupt: true
    keywords: ["관심 없", "필요 없", "안 해요", "됐어요", "생각 없", "안 할"]
    reply: ["[클립:56] [클립:26]", "[클립:58]"]
    status: "거절"
    end_on_repeat: true

default:
  reply: ["[클립:53] [클립:55]"]              # 실제 계약조건을 확인해야… / 담당자가 확인해서 안내드릴게요
  handoff: true
