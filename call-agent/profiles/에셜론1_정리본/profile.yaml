# 에셜론 스크립트1 (금일 정리본): 첫도단 → 상위노출 무료 소개 → 번호 받기 + 반론(광고 중 / 왜 무료 / 돈 드나)
engine: "free"
agent:
  my_name: ""
  company: "에셜론"
  product: "네이버 플레이스 상위노출 무료 후기 안내 (정리본)"
  opening: "[클립:1]"    # 39번은 두 녹음을 이어 붙여 "대표님" 뒤가 끊겨서, 한 번에 읽은 1번으로 (2026-10-20)
  ai_disclosure: ""
  fillers: ["[클립:25]"]   # 맞장구: 25번을 AI 내 목소리 짧은 "네." 로 바꿔서 다시 켬 (2026-10-21). 26번은 안 씀
  hello_again: ["[클립:32]", "[클립:38]"]
  hello_again_times: 2
voice:
  clips_dir: "profiles/에셜론/clips"    # 녹음은 '에셜론' 프로필 것을 같이 씀 (한 번만 넣으면 됨)
  keyterms: ["네이버 플레이스", "상위노출", "블로그", "인스타그램", "제안서", "에셜론"]
rules:
  branch_column: "업종"
customers:
  path: "data/에셜론_고객.xlsx"
  columns: {name: "상호명", clinic: "상호명", phone: "전화번호", status: "상태", memo: "메모", last_call: "통화일시"}
notify:
  kakao_room: ""
  on_status: ["제안서발송"]
