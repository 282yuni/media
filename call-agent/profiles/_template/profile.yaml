# 이 프로필에서만 바꿀 설정. config.yaml 위에 덮어씌워집니다. 필요 없는 줄은 지워도 됩니다.

# free: 녹음해 둔 말만 (무료) / ai: Claude 가 상황에 맞게 대답 + 내 복제 목소리 (유료, .env 키 필요)
engine: "ai"

voice:
  mode: "mixed"      # ai 일 때: 녹음(clips/) 있으면 녹음 그대로, 없는 말은 복제 목소리

agent:
  my_name: "홍길동"
  company: ""        # 개인 통화면 비워 두기
  product: "개인 용무 통화"
  # 첫인사. ai 모드는 문장으로, free 모드는 녹음 번호("[클립:1]")로
  opening: "안녕하세요, 홍길동입니다."
  # AI 고지 — 지우지 마세요 (AI 기본법, 상대가 나중에 알게 되면 분쟁 위험)
  ai_disclosure: "참고로 지금은 제 AI 비서가 제 목소리로 먼저 통화를 돕고 있어요. 필요하시면 제가 바로 받을게요."
  fillers: ["네,"]
  hello_again: "여보세요? 제 말 잘 들리세요?"

# 이 프로필은 고객 엑셀에 기록하지 않음 (dial 명령은 녹취·요약만 logs/<프로필>/ 에 저장)
