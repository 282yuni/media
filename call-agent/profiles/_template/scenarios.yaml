# free 모드용 상황표 (형식은 ../../scenarios.example.yaml 설명 참고). ai 모드면 없어도 됩니다.
flow:
  - say: "[클립:2]"        # 용건 말하기
  - say: "[클립:3]"        # 마무리
    end: true
scenarios:
  - name: AI 질문
    keywords: ["AI", "에이아이", "기계", "로봇", "사람이에요", "본인 맞"]
    reply: ["[클립:4]"]    # "네 지금은 제 AI 비서가 돕고 있어요. 제가 바로 받을게요."
    handoff: true
  - name: 본인 인증·결제
    keywords: ["주민", "생년월일", "인증번호", "카드번호", "계좌", "결제", "동의하시"]
    reply: ["[클립:5]"]    # "그 부분은 제가 직접 말씀드릴게요. 잠시만요."
    handoff: true
  - name: 다른 상품 권유
    keywords: ["혜택", "이번에", "추천", "프로모션", "할인"]
    reply: ["[클립:6]", "[클립:7]"]
default:
  reply: ["[클립:8]"]      # "그 부분은 확인하고 다시 연락드릴게요."
  handoff: true
