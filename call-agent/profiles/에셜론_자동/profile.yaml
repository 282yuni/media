# 에셜론 자동: 고객 엑셀의 '업종' 칸을 보고 손님마다 스크립트를 알아서 고름
#   음식점·미용실·네일숍·피부관리숍 → 스크립트2 (업종별)
#   그 밖의 업종 / 업종 칸이 비어 있음 → 스크립트1 (정리본)
#   엑셀에 '스크립트' 칸을 만들어 1 또는 2 를 적으면 그 손님은 그 번호로 (업종보다 우선)
engine: "free"
agent:
  company: "에셜론"
voice:
  clips_dir: "profiles/에셜론/clips"
customers:
  path: "data/에셜론_고객.xlsx"
  columns: {name: "상호명", clinic: "상호명", phone: "전화번호", status: "상태", memo: "메모", last_call: "통화일시"}
notify:
  kakao_room: ""            # 여기 하나만 정해 두면 스크립트 1·2 모두 이 대화방으로 보냄
  on_status: ["제안서발송"]
auto_script:
  column: "업종"
  pick_column: "스크립트"
  numbers: {"1": "에셜론1_정리본", "2": "에셜론2_업종별"}
  rules:
    - {profile: "에셜론2_업종별", match: ["음식", "식당", "한식", "중식", "일식", "양식", "분식", "고기", "갈비", "삼겹", "치킨", "피자",
                                       "족발", "보쌈", "국밥", "횟집", "회집", "초밥", "돈까스", "레스토랑", "주점", "술집", "포차",
                                       "카페", "베이커리", "빵", "뷔페", "냉면", "곱창", "찜", "탕"]}
    - {profile: "에셜론2_업종별", match: ["미용", "헤어", "살롱", "바버", "펌", "이발"]}
    - {profile: "에셜론2_업종별", match: ["네일", "젤", "손톱"]}
    - {profile: "에셜론2_업종별", match: ["피부", "에스테틱", "관리실", "왁싱", "스킨"]}
  default: "에셜론1_정리본"
