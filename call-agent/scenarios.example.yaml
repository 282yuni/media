# 상황표 — 무료 모드에서 AI 대신 이 표대로 대답합니다.  copy scenarios.example.yaml scenarios.yaml
#
# 만드는 법 (제일 쉬운 방법): Codex 에게
#   "상담스크립트.txt 와 clips/clips.yaml 을 보고 scenarios.yaml 을 만들어줘" 라고 요청하세요.
# [클립:번호] 는 clips/clips.yaml 의 번호입니다 (python main.py clips 내녹음.mp3 로 만듦).
# 아래 번호는 예시입니다. 내 clips.yaml 번호로 바꿔야 합니다.
#
# 판단 순서
#   1) 상대 말이 아래 scenarios 중 하나에 맞으면 → 그 reply (위에 있는 상황일수록 우선)
#   2) 안 맞고 "네/예/말씀하세요"처럼 짧은 대답이면 → flow(스크립트 순서)의 다음 멘트
#   3) 둘 다 아니면 → default (보통 "확인해서 다시 연락드릴게요" + 나에게 넘김)

flow:   # 첫인사(config 의 agent.opening) 다음에 이어지는 스크립트 순서
  - say: "[클립:3] [클립:4]"          # 예: 용건 소개 — "다름이 아니라 원장님, 요즘 신환 문의는 좀 어떠세요?"
  - say: "[클립:5]"                   # 예: 핵심 혜택 한 줄
  - say: "[클립:6]"                   # 예: 다음 단계 제안 — "자료 하나 문자로 보내드려도 될까요?"
    status: "관심"
  - say: "[클립:7]"                   # 예: 마무리 인사
    end: true

scenarios:
  # ── 꼭 맨 위에 둘 것 ──
  - name: 수신거부
    keywords: ["연락하지 마", "전화하지 마", "번호 지워", "그만 전화", "다시는"]
    reply: ["[클립:20]"]              # 예: "네 알겠습니다. 앞으로 연락 안 드릴게요. 죄송합니다."
    status: "수신거부"
    end: true
  - name: AI 질문
    keywords: ["AI", "에이아이", "기계", "로봇", "자동응답", "사람이에요", "사람 맞", "녹음이에요"]
    reply: ["[클립:21]"]              # 예: "네, 지금은 AI 비서가 먼저 안내드리고 있어요. 담당자 바로 연결해 드릴게요."
    handoff: true                     # 절대 "사람이에요"라고 답하는 녹음을 넣지 마세요
  - name: 담당자 요청
    keywords: ["담당자", "바꿔", "사람 연결", "직접 통화", "책임자"]
    reply: ["[클립:22]"]              # 예: "네 잠시만요, 바로 연결해 드릴게요."
    handoff: true

  # ── 흔한 상황 ──
  - name: 원장님 부재
    keywords: ["안 계", "안계", "부재", "진료 중", "진료중", "수술", "나가셨", "휴진", "자리에 없"]
    examples: ["원장님 지금 안 계세요", "진료 중이세요"]
    reply: ["[클립:10]", "[클립:11]"]  # 예: "아 그러시군요. 몇 시쯤 통화 괜찮으실까요?" / 두 번째로 나오면 다른 녹음
    status: "재통화"
  - name: 바쁨
    keywords: ["바빠", "바쁘", "나중에", "지금 좀", "시간 없"]
    reply: ["[클립:12]"]
    status: "재통화"
  - name: 이미 업체 있음
    keywords: ["하는 데 있", "업체 있", "이미 하고", "쓰고 있", "계약돼"]
    reply: ["[클립:13]"]
  - name: 가격 문의
    keywords: ["얼마", "가격", "비용", "금액", "견적"]
    reply: ["[클립:14]"]              # 녹음해 둔 가격 안내가 없으면 "확인해서 문자로 보내드릴게요" 녹음
    status: "관심"
  - name: 자료 요청
    keywords: ["자료", "보내", "문자", "카톡", "메일", "팩스"]
    reply: ["[클립:15]"]
    status: "자료요청"
  - name: 관심 없음
    keywords: ["관심 없", "필요 없", "안 해요", "괜찮습니다", "됐어요", "생각 없"]
    reply: ["[클립:16]", "[클립:17]"]  # 첫 번째는 한 번 더 권유, 두 번째는 정중한 마무리
    status: "거절"
  - name: 잘 안 들림
    keywords: ["안 들려", "뭐라고요", "다시 말씀", "잘 안 들"]
    reply: ["[클립:18]"]
  - name: 누구세요
    keywords: ["누구", "어디", "무슨 일", "어떤 일", "어디서"]
    reply: ["[클립:1]"]               # 자기소개 녹음

default:
  reply: ["[클립:19]"]                # 예: "그 부분은 정확히 확인해서 다시 연락드릴게요."
  handoff: true
